name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: make lint python-test

  java:
    name: Java checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            services/order-service/pom.xml
            services/downstream-service/pom.xml
      - run: mvn -B -ntp verify
        working-directory: services/order-service
      - run: mvn -B -ntp verify
        working-directory: services/downstream-service

  integration:
    name: Compose validation
    runs-on: ubuntu-latest
    needs: [python, java]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Start vertical slice
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: MCP transport and idempotency smoke
        run: make mcp-smoke
      - name: Redis unavailable scenario
        run: make scenario SCENARIO=redis-unavailable
      - name: Controlled MySQL read scenario
        run: make scenario SCENARIO=mysql-unavailable
      - name: Inventory latency scenario
        run: make scenario SCENARIO=inventory-latency
      - name: Payment HTTP 5xx scenario
        run: make scenario SCENARIO=payment-5xx
      - name: Evaluate latest persisted scenarios against ground truth
        run: make evaluate
      - name: Capture failure evidence
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

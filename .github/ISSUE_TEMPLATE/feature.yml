name: Feature
about: Propose a scoped feature or engineering task
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: What problem or context motivates this work?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this Issue is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included?
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What is intentionally excluded?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a checklist where possible.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Constraints, links, risks, or design notes.
